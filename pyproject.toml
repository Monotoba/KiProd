[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiprod"
version = "0.1.0"
description = "Traceable KiCad production package and quoting assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KiProd contributors" }]
dependencies = ["pydantic>=2.7", "typer>=0.12"]

[project.optional-dependencies]
reports = ["openpyxl>=3.1"]
dev = ["mypy>=1.10", "openpyxl>=3.1", "pytest>=8.0", "ruff>=0.5", "types-openpyxl>=3.1"]

[project.scripts]
kiprod = "kiprod.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["kiprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["kiprod/core", "kiprod/kicad"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
